    <div class="container">
        
    <div class="card-padre3">
    <div class="card card-hijo3">
    <div class="card-body">
    <h5 class="card-title">REGISTRO DE TRASLADOS</h5>
    <br>
      
    <form>
            
            <div class="mb-3">
              <label for="fechamov" class="form-label">Fecha</label>
              <input type="date" class="form-control" id="fecha" style="width: 150px;">
            </div>

            <div class="mb-3">
            
              <div class="row">
                        
                       
                <div class="col-12 col-sm-4 col-md-4">
                  <label for="Bodega" class="form-label">Bodega salida</label>
                  <input type="text" class="form-control" id="Bodega" style="width: 100px;">
                </div>
              
                <div class="col-12 col-sm-8 col-md-8">
                  <label for="BodegaE" class="form-label">Bodega entrada</label>
                  <input type="text" class="form-control" id="BodegaE" style="width: 100px;">
                </div>
              
              </div>

            

            <div class="mb-3">
            
              <div class="row">
                        
                       
                <div class="col-12 col-sm-4 col-md-4">
                  <label for="DescripBodega" class="form-label">Des.Bodega salida</label>
                  <input type="text" class="form-control" id="DescripBodega">
                </div>
              
                <div class="col-12 col-sm-8 col-md-8">
                  <label for="DescripBodegaE" class="form-label">Des.Bodega entrada</label>
                  <input type="text" class="form-control" id="DescripBodegaE">
                </div>
              
              </div>

            </div>
            
            
            <div class="mb-3"> 
              
              <div class="row">

                <div class="col-12 col-sm-4 col-md-4">
                  <label for="Ref" class="form-label">Referencia</label>
                  <input type="text" class="form-control" id="Ref" style="width: 150px;">
              
               </div>

                <div class="col-12 col-sm-4 col-md-4">
                  <label for="Descrip" class="form-label">Descripción</label>
                  <input type="text" class="form-control" id="Descrip">
              
                </div>

              </div>

            <div class="mb-3">  
              <label for="Cantidad" class="form-label">U.M.</label>
              <input type="text" class="form-control" id="um" style="width: 100px;">
              
            </div>

            <div class="mb-3">  
              <label for="Cantidad" class="form-label">Cantidad</label>
              <input type="number" class="form-control" id="Cantidad" style="width: 80px;">
              
            </div>

            <div class="centrar_boton">
            <button type="button" class="btn btn-primary">Registrar</button>
            <button type="reset" class="btn btn-danger">Limpiar</button>
            </div>

    </form>
    </div>
</div>
