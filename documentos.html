    <div class="container">
        
    <div class="card-padre2">
    <div class="card card-hijo2">
    <div class="card-body">
    <h5 class="card-title">CREACIÓN DE BODEGAS</h5>
    
      
    <form id="formuno">

                        
            <div class="mb-3">  
              <label for="Tip" class="form-label">TipoE/S/T</label>
              <input type="text" class="form-control" id="tipo" style="width: 200px;">
              
            </div>

            <div class="mb-3">  
              <label for="Sig" class="form-label">Sigla</label>
              <input type="text" class="form-control" id="sigla" style="width: 200px;">
              
            </div>

            <div class="mb-3">  
              <label for="Descripdoc" class="form-label">Descripción Documento</label>
              <input type="text" class="form-control" id="descripcion">
              
            </div>
                      
            

            <div class="centrar_boton">
            <button type="submit" class="btn btn-primary">Registrar</button>
            <button type="reset" class="btn btn-danger">Limpiar</button>
            </div>

    </form>
    
    </div>
    <div class="mensaje" id="mensaje"></div>
</div>

</div>
</div>





<script>

document.getElementById("formuno").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    
    tipo: document.getElementById("tipo").value,
    sigla: document.getElementById("sigla").value,
    descrip: document.getElementById("descripcion").value          
    };

  const respuesta = await fetch("http://localhost/apis/rest/doc.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    //Convierte el objeto JavaScript a JSON.
    body: JSON.stringify(data)
  });

  const resultado = await respuesta.json();
  const divMensaje = document.getElementById("mensaje");

      if (resultado.success) {
          divMensaje.style.color = "Blue";
          divMensaje.textContent = "✔️ documento registrado exitosamente";
      } else {
          divMensaje.style.color = "red";
          divMensaje.textContent = "❌" + (resultado.error || resultado.mensaje);
      }

  document.getElementById("tipo").value = "";
  document.getElementById("sigla").value = "";
  document.getElementById("descripcion").value = ""
  
}); 

document.getElementById("formuno").addEventListener("reset", async (e) => {
  e.preventDefault();

        const divMensaje = document.getElementById("mensaje");
        divMensaje.textContent = "";
        document.getElementById("tipo").value = "";
        document.getElementById("sigla").value = "";
        document.getElementById("descripcion").value = ""

});



</script>    

</body>
