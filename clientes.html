<body>
<div class="container-fluid">

<div class="container_nav">

  <nav class="navbar navbar-expand-lg fixed-top" style="background-color: #0EADE6;" data-bs-theme="light">

    <div class="container">
        
    <div class="card-padre2">
    <div class="card card-hijo2">
    <div class="card-body">
    <h5 class="card-title">CREACIÓN DE CLIENTES</h5>
    
      
    <form id="formcliente">
            
            <div class="mb-3">  
              <label for="NIT" class="form-label">NIT</label>
              <input type="text" class="form-control" id="nit" style="width: 200px;">
              
            </div>

            
            <div class="mb-3">  
              <label for="descripcionc" class="form-label">Descripción Cliente</label>
              <input type="text" class="form-control" id="descripcionc">
              
            </div>
                      
            

            <div class="centrar_boton">
            <button type="submit" class="btn btn-primary">Registrar</button>
            <button type="reset" class="btn btn-danger">Limpiar</button>
            <button href="javascript:void(0)" onclick="avanzarPagina('crudclientes.html')" type="reset" class="btn btn-success">Volver</button>
            </div>

    </form>
    </div>
    <div class="mensaje" id="mensaje"></div>
</div>
</div>
</div>


    <script>
      document.getElementById("formcliente").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
    
      nit: document.getElementById("nit").value,
      descrip: document.getElementById("descripcionc").value          
      };

      const respuesta = await fetch("http://localhost/apis/rest/cliente.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      //Convierte el objeto JavaScript a JSON.
      body: JSON.stringify(data)
      });

      const resultado = await respuesta.json();
      const divMensaje = document.getElementById("mensaje");

          if (resultado.success) {
              divMensaje.style.color = "Blue";
              divMensaje.textContent = "✔️ Cliente registrado exitosamente";
          } else {
              divMensaje.style.color = "red";
              divMensaje.textContent = "❌" + (resultado.error || resultado.mensaje);
          }

      document.getElementById("nit").value = "";
      document.getElementById("descripcionc").value = ""
  
      }); 

      document.getElementById("formcliente").addEventListener("reset", async (e) => {
      e.preventDefault();

            const divMensaje = document.getElementById("mensaje");
            divMensaje.textContent = "";
            document.getElementById("nit").value = "";
            document.getElementById("descripcionc").value = ""

      });


// 1. Leer el dato registrado en index
  const datoRecibido = localStorage.getItem("datoGuardado");
  
  // 2. Cargar dato del index en el ancla cuyo id es resultado
  document.getElementById("resultado").textContent = datoRecibido;

  // 3. Borrar información del usuario una vez se hace click en el enlace salir
  const ancla = document.getElementById('resultado');
  const borrar = document.getElementById('borrar');
 
  borrar.addEventListener('click', function(evento) { 
      evento.preventDefault();       
      
      //Se borra el texto visualmente
      ancla.textContent = '';
      
      //Se borra el dato de la memoria del navegador
      localStorage.removeItem("datoGuardado"); 
      
      //Se redirige a index.html
      window.location.href = "index.html";
  });



</script>
